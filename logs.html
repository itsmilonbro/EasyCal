<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>জাহাঙ্গীর স'মিল - গোলাই কাঠের হিসাব</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Bangla', 'Tahoma', sans-serif;
        }

        :root {
            --primary: #1e3a2f;
            --secondary: #2d6a4f;
            --accent: #a7c957;
            --light: #f4f1de;
            --dark: #2b2b2b;
            --border: #d4d4d4;
            --shadow: 0 8px 20px rgba(0,0,0,0.08);
            --radius: 1rem;
        }

        body {
            background: #eef2e6;
            padding: 10px;
            color: var(--dark);
        }

        /* Loader Overlay */
        #loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1e3a2fe6;
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .loader-box {
            background: white;
            padding: 2rem 3rem;
            border-radius: 2rem;
            text-align: center;
            box-shadow: var(--shadow);
            animation: fadeInUp 0.3s ease;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #ddd;
            border-top: 6px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeInUp { from { opacity:0; transform: translateY(20px);} to { opacity:1; transform: translateY(0);} }

        /* Password Popup */
        .password-popup {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 1100;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: monospace;
        }

        .password-card {
            background: white;
            max-width: 380px;
            width: 90%;
            padding: 2rem 1.8rem;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
            animation: fadeInUp 0.25s ease;
        }

        .password-card h3 {
            color: var(--primary);
            margin-bottom: 0.75rem;
        }

        .password-card input {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            border: 2px solid #ccc;
            border-radius: 50px;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
        }

        .password-card button {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        /* main app container (hidden initially) */
        .app-container {
            max-width: 1300px;
            margin: 0 auto;
            display: none;
        }

        /* header & brand */
        .brand-header {
            background: var(--primary);
            color: white;
            padding: 1.2rem 1rem;
            border-radius: var(--radius);
            margin-bottom: 1.8rem;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .brand-header h1 {
            font-size: 2rem;
            letter-spacing: 1px;
        }

        .brand-header .sub {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 400;
        }

        /* info row : customer + date */
        .info-bar {
            background: white;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 15px;
            box-shadow: var(--shadow);
        }

        .info-field {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .info-field label {
            font-weight: 700;
            background: var(--accent);
            padding: 5px 14px;
            border-radius: 40px;
            color: #1e3a2f;
        }

        .info-field input, .info-field span {
            font-size: 1rem;
            padding: 6px 12px;
            border: 1px solid #bbb;
            border-radius: 30px;
            background: #fefefe;
        }

        /* card style */
        .card {
            background: white;
            border-radius: var(--radius);
            padding: 1.2rem;
            margin-bottom: 1.8rem;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--radius);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 550px;
        }

        th {
            background: var(--secondary);
            color: white;
            padding: 12px 8px;
            font-weight: 600;
            border: 1px solid #3d7a5a;
        }

        td {
            padding: 10px 6px;
            border-bottom: 1px solid var(--border);
            text-align: center;
            vertical-align: middle;
        }

        input.table-input {
            width: 100px;
            padding: 8px 6px;
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 0.85rem;
            transition: 0.2s;
            background: #fefef7;
        }

        input.table-input:focus {
            border-color: var(--secondary);
            outline: none;
            box-shadow: 0 0 0 2px rgba(45,106,79,0.2);
        }

        .cft-readonly {
            background: #e9f5e9;
            font-weight: bold;
            border-radius: 12px;
            padding: 8px 6px;
            display: inline-block;
            min-width: 80px;
            text-align: center;
            font-weight: 600;
            color: #1e4a2f;
            border: 1px solid #c8e0c8;
        }

        .total-section {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: space-between;
            margin-top: 1rem;
            align-items: center;
        }

        .total-box {
            background: var(--light);
            padding: 0.8rem 1.8rem;
            border-radius: 40px;
            min-width: 180px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .total-box span {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary);
        }

        .btn-group {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            padding: 10px 22px;
            border: none;
            background: var(--secondary);
            color: white;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        button:hover {
            background: var(--primary);
            transform: scale(0.97);
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            padding: 1rem;
            font-size: 0.85rem;
            color: #2c3e2f;
        }
        footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }
        @media (max-width: 680px) {
            .info-field input { width: 130px; }
            .table-input { width: 75px; }
            body { padding: 2px; }
            .cft-readonly { min-width: 65px; font-size: 0.8rem; }
             table { width: 100% ;}
            th { font-size: 0.75rem; padding: 8px 4px; }
        }
        /* print optimization */
        @media print {
            button, .btn-group, .password-popup, #loader-overlay {
                display: none !important;
            }
            body {
                background: white;
                padding: 0;
            }
            .app-container {
                display: block !important;
            }
            input.table-input {
                border: none;
                background: transparent;
                text-align: center;
            }
            .cft-readonly {
                background: #f0f0f0;
                border: 1px solid #ccc;
            }
        }
    </style>
</head>
<body>

<!-- Loader + brand loader -->
<div id="loader-overlay">
    <div class="loader-box">
        <div class="spinner"></div>
        <h3 style="color:#1e3a2f;">জাহাঙ্গীর স'মিল</h3>
        <p>গোলাই কাঠের হিসাব প্রস্তুত...</p>
    </div>
</div>

<!-- main application wrapper -->
<div class="app-container" id="mainApp">
    <div class="brand-header">
        <h1>জাহাঙ্গীর স'মিল</h1>
        <div class="sub">গোলাই কাঠের হিসাব (CFT) • বনপাড়া, নাটোর </div>
    </div>

    <!-- Customer & Date row (Serial Number removed as requested) -->
    <div class="info-bar">
        <div class="info-field">
            <label>👤 ক্রেতার নাম</label>
            <input type="text" id="customerName" placeholder="নাম লিখুন" value="">
        </div>
        <div class="info-field">
            <label>📅 তারিখ</label>
            <span id="todayDateSpan"></span>
        </div>
    </div>

    <!-- Main Table card: 50 fixed rows - NO SERIAL COLUMN -->
    <div class="card">
        <div class="table-wrapper">
            <table id="timber-table">
                <thead>
                    <tr>
                        <th>বের/গোলাই (ইঞ্চি)</th>
                        <th>দৈর্ঘ্য (ফিট)</th>
                        <th>পরিমাণ (পিস)</th>
                        <th>CFT (মোট ঘনফুট)</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- price & totals -->
    <div class="card">
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="unitPriceInput" style="font-weight: bold; margin-right: 12px;">প্রতি CFT এর দাম (BDT):</label>
            <input type="number" id="unitPriceInput" placeholder="দাম লিখুন" step="0.01" value="0" style="width:220px; padding:10px; border-radius:40px; border:1px solid #ccc;">
        </div>
        <div class="total-section">
            <div class="total-box">🪵 মোট CFT : <span id="totalCftSpan">0.00</span></div>
            <div class="total-box">💰 মোট মূল্য (BDT) : <span id="totalPriceSpan">0.00</span></div>
        </div>
        <div class="btn-group">
            <button id="resetAllBtn">🔄 রিসেট / ক্লিয়ার করুন</button>
            <button id="pdfPrintBtn">🖨️ PDF প্রিন্ট / ডাউনলোড</button>
        </div>
    </div>

    <footer>
        Dev By - <a href="https://facebook.com/itsmilonbro" target="_blank">Milon Hossain</a> | গোলাই কাঠের হিসাব | স'মিল | বনপাড়া | নাটোর
    </footer>
</div>

<script>
    // ---------- Auto reduction formula based on diameter (inches) ----------
    function getAutoReduction(diameterInch) {
        if (diameterInch === "" || diameterInch === null || isNaN(diameterInch)) return 0;
        const d = parseFloat(diameterInch);
        if (isNaN(d) || d <= 0) return 0;
        // Slabs as per requirement
        if (d >= 1 && d <= 17) return 1;
        else if (d >= 18 && d <= 29) return 2;
        else if (d >= 30 && d <= 41) return 3;
        else if (d >= 42 && d <= 53) return 4;
        else if (d >= 54 && d <= 65) return 5;
        else if (d >= 66 && d <= 77) return 6;
        else if (d >= 78 && d <= 89) return 7;
        else if (d >= 90 && d <= 102) return 8;
        else if (d >= 103 && d <= 113) return 9;
        else if (d >= 114 && d <= 125) return 10;
        else if (d >= 126 && d <= 300) return 10;
        else return 0;
    }

    // Calculate CFT for a single row: adjusted diameter = original - reduction
    // Formula: (adjDiameter^2 * length * quantity) / 2304
    function computeRowCFT(diameterVal, lengthVal, qtyVal) {
        if (diameterVal === "" || lengthVal === "" || qtyVal === "") return 0;
        let d = parseFloat(diameterVal);
        let len = parseFloat(lengthVal);
        let qty = parseFloat(qtyVal);
        if (isNaN(d) || isNaN(len) || isNaN(qty) || d <= 0 || len <= 0 || qty <= 0) return 0;
        const reduction = getAutoReduction(d);
        let adjDiameter = d - reduction;
        if (adjDiameter <= 0) return 0;
        const cft = (adjDiameter * adjDiameter * len * qty) / 2304;
        return cft;
    }

    // Build fixed 50 rows - NO SERIAL NUMBER column, all placeholders are empty strings
    const tbody = document.getElementById('table-body');
    function buildTableRows() {
        tbody.innerHTML = '';
        for (let i = 1; i <= 50; i++) {
            const tr = document.createElement('tr');
            
            // Diameter column with EMPTY placeholder (no text)
            const tdDia = document.createElement('td');
            const diaInput = document.createElement('input');
            diaInput.type = 'number';
            diaInput.step = '0.01';
            diaInput.placeholder = '';   // Empty placeholder as requested
            diaInput.classList.add('table-input', 'dia-input');
            tdDia.appendChild(diaInput);
            
            // Length column with EMPTY placeholder
            const tdLen = document.createElement('td');
            const lenInput = document.createElement('input');
            lenInput.type = 'number';
            lenInput.step = '0.01';
            lenInput.placeholder = '';    // Empty placeholder
            lenInput.classList.add('table-input', 'len-input');
            tdLen.appendChild(lenInput);
            
            // Quantity column with EMPTY placeholder
            const tdQty = document.createElement('td');
            const qtyInput = document.createElement('input');
            qtyInput.type = 'number';
            qtyInput.step = '1';
            qtyInput.placeholder = '';    // Empty placeholder
            qtyInput.classList.add('table-input', 'qty-input');
            tdQty.appendChild(qtyInput);
            
            // CFT result display (readonly)
            const tdCft = document.createElement('td');
            const cftSpan = document.createElement('span');
            cftSpan.classList.add('cft-readonly');
            cftSpan.textContent = '0.00';
            tdCft.appendChild(cftSpan);
            
            tr.appendChild(tdDia);
            tr.appendChild(tdLen);
            tr.appendChild(tdQty);
            tr.appendChild(tdCft);
            tbody.appendChild(tr);
        }
    }
    buildTableRows();
    
    // Update single row CFT display and return calculated cft value
    function updateSingleRow(rowElement) {
        const diaInput = rowElement.querySelector('.dia-input');
        const lenInput = rowElement.querySelector('.len-input');
        const qtyInput = rowElement.querySelector('.qty-input');
        const cftSpan = rowElement.querySelector('.cft-readonly');
        let diaVal = diaInput.value ? parseFloat(diaInput.value) : NaN;
        let lenVal = lenInput.value ? parseFloat(lenInput.value) : NaN;
        let qtyVal = qtyInput.value ? parseFloat(qtyInput.value) : NaN;
        let cft = 0;
        if (!isNaN(diaVal) && !isNaN(lenVal) && !isNaN(qtyVal) && diaVal > 0 && lenVal > 0 && qtyVal > 0) {
            cft = computeRowCFT(diaVal, lenVal, qtyVal);
        }
        cftSpan.textContent = cft.toFixed(2);
        return cft;
    }
    
    // Recalculate all rows and update total CFT + total price
    function updateAllCalculations() {
        const rows = tbody.querySelectorAll('tr');
        let totalCft = 0;
        rows.forEach(row => {
            const cft = updateSingleRow(row);
            totalCft += cft;
        });
        document.getElementById('totalCftSpan').innerText = totalCft.toFixed(2);
        const unitPrice = parseFloat(document.getElementById('unitPriceInput').value);
        const totalMoney = (isNaN(unitPrice) ? 0 : totalCft * unitPrice);
        document.getElementById('totalPriceSpan').innerText = totalMoney.toFixed(2);
    }
    
    // Event delegation for all input changes
    function bindTableEvents() {
        tbody.addEventListener('input', function(e) {
            const target = e.target;
            if (target.classList.contains('dia-input') || target.classList.contains('len-input') || target.classList.contains('qty-input')) {
                const row = target.closest('tr');
                updateSingleRow(row);
                updateAllCalculations();
            }
        });
    }
    bindTableEvents();
    
    // Unit price change listener
    const unitPriceEl = document.getElementById('unitPriceInput');
    unitPriceEl.addEventListener('input', function() {
        updateAllCalculations();
    });
    
    // Reset button: clears all inputs, resets price to 0, clears customer name
    const resetBtn = document.getElementById('resetAllBtn');
    resetBtn.addEventListener('click', function() {
        const allDia = document.querySelectorAll('.dia-input');
        const allLen = document.querySelectorAll('.len-input');
        const allQty = document.querySelectorAll('.qty-input');
        allDia.forEach(inp => inp.value = '');
        allLen.forEach(inp => inp.value = '');
        allQty.forEach(inp => inp.value = '');
        unitPriceEl.value = '0';
        const custField = document.getElementById('customerName');
        if (custField) custField.value = '';
        updateAllCalculations();
    });
    
    // ---------- PRINT / PDF generation: only non-empty rows with CFT>0 ----------
    function getPrintableContent() {
        const originalApp = document.getElementById('mainApp');
        const cloneDiv = originalApp.cloneNode(true);
        
        // Filter table rows: keep only rows where diameter, length, quantity are filled and CFT > 0
        const cloneTableBody = cloneDiv.querySelector('#table-body');
        if (cloneTableBody) {
            const rows = cloneTableBody.querySelectorAll('tr');
            rows.forEach(row => {
                const diaInp = row.querySelector('.dia-input');
                const lenInp = row.querySelector('.len-input');
                const qtyInp = row.querySelector('.qty-input');
                const cftSpan = row.querySelector('.cft-readonly');
                let cftValue = 0;
                if (cftSpan) cftValue = parseFloat(cftSpan.textContent) || 0;
                let hasValidData = false;
                if (diaInp && lenInp && qtyInp) {
                    const diaVal = diaInp.value ? parseFloat(diaInp.value) : 0;
                    const lenVal = lenInp.value ? parseFloat(lenInp.value) : 0;
                    const qtyVal = qtyInp.value ? parseFloat(qtyInp.value) : 0;
                    if (diaVal > 0 && lenVal > 0 && qtyVal > 0 && cftValue > 0) {
                        hasValidData = true;
                    }
                }
                if (!hasValidData) {
                    row.remove();   // remove empty/unfilled rows from print version
                } else {
                    // Convert input fields to static text for clean printing
                    if (diaInp) {
                        const diaVal = diaInp.value;
                        const textNode = document.createTextNode(diaVal);
                        const parent = diaInp.parentNode;
                        parent.removeChild(diaInp);
                        parent.appendChild(textNode);
                    }
                    if (lenInp) {
                        const lenVal = lenInp.value;
                        const parent = lenInp.parentNode;
                        const textNode = document.createTextNode(lenVal);
                        parent.removeChild(lenInp);
                        parent.appendChild(textNode);
                    }
                    if (qtyInp) {
                        const qtyVal = qtyInp.value;
                        const parent = qtyInp.parentNode;
                        const textNode = document.createTextNode(qtyVal);
                        parent.removeChild(qtyInp);
                        parent.appendChild(textNode);
                    }
                }
            });
        }
        
        // Replace customer name input with plain text
        const custInputClone = cloneDiv.querySelector('#customerName');
        if (custInputClone && custInputClone.value) {
            const custVal = custInputClone.value;
            const spanCust = document.createElement('span');
            spanCust.textContent = `ক্রেতা: ${custVal}`;
            spanCust.style.fontWeight = 'bold';
            spanCust.style.background = '#eef2e6';
            spanCust.style.padding = '4px 12px';
            spanCust.style.borderRadius = '30px';
            custInputClone.parentNode.replaceChild(spanCust, custInputClone);
        } else if (custInputClone) {
            const spanCust = document.createElement('span');
            spanCust.textContent = `ক্রেতা: ________`;
            custInputClone.parentNode.replaceChild(spanCust, custInputClone);
        }
        
        // Convert unit price input to static text
        const priceInputClone = cloneDiv.querySelector('#unitPriceInput');
        if (priceInputClone) {
            const priceVal = priceInputClone.value || '0';
            const priceSpan = document.createElement('strong');
            priceSpan.style.background = '#f4f1de';
            priceSpan.style.padding = '5px 15px';
            priceSpan.style.borderRadius = '40px';
            priceSpan.textContent = `প্রতি CFT দাম: ${priceVal} BDT`;
            priceInputClone.parentNode.replaceChild(priceSpan, priceInputClone);
        }
        
        // Remove all interactive buttons from print version
        const allBtns = cloneDiv.querySelectorAll('button');
        allBtns.forEach(btn => btn.remove());
        
        const btnGroups = cloneDiv.querySelectorAll('.btn-group');
        btnGroups.forEach(group => group.remove());
        
        return cloneDiv.outerHTML;
    }
    
    const printBtn = document.getElementById('pdfPrintBtn');
    printBtn.addEventListener('click', function() {
        const printHtmlContent = getPrintableContent();
        const win = window.open('', '_blank');
        win.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="UTF-8">
                <title>জাহাঙ্গীর স'মিল - গোলাই কাঠের হিসাব</title>
                <style>
                    * { font-family: 'Segoe UI', 'Bangla', sans-serif; margin:0; padding:0; box-sizing:border-box; }
                    body { padding: 30px 20px; background: white; }
                    .brand-header { background: #1e3a2f; color: white; padding: 1rem; text-align:center; border-radius: 20px; margin-bottom: 20px; }
                    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
                    th, td { border: 1px solid #aaa; padding: 10px 6px; text-align: center; }
                    th { background: #2d6a4f; color: white; }
                    .total-box { background: #f4f1de; padding: 8px 15px; border-radius: 30px; display: inline-block; margin: 10px; text-align:center; }
                    .info-bar { display: flex; justify-content: space-between; margin-bottom: 20px; background: #e9ecef; padding: 10px 20px; border-radius: 40px; align-items: center;}
                    footer { margin-top: 30px; text-align:center; font-size:12px; color:#2c3e2f; }
                    .total-section { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
                    .card { margin-bottom: 20px; }
                    .cft-readonly { background: #e9f5e9; padding: 4px 8px; border-radius: 12px; font-weight:bold; }
                </style>
            </head>
            <body>
                ${printHtmlContent}
                <footer>জাহাঙ্গীর স'মিল, বনপাড়া, নাটোর | Dev: Milon Hossain</footer>
            </body>
            </html>
        `);
        win.document.close();
        win.print();
    });
    
    // Set today's date in Bengali format
    function setTodayDate() {
        const today = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        const banglaDate = today.toLocaleDateString('bn-BD', options);
        document.getElementById('todayDateSpan').innerText = banglaDate;
    }
    setTodayDate();
    
    // ---------- PASSWORD PROTECTION + LOADER ----------
    window.addEventListener('load', function() {
        setTimeout(function() {
            const loader = document.getElementById('loader-overlay');
            if (loader) loader.style.display = 'none';
            showPasswordPopup();
        }, 1500);
    });
    
    let isAuthenticated = false;
    function showPasswordPopup() {
        if (isAuthenticated) return;
        if (document.querySelector('.password-popup')) return;
        const popupDiv = document.createElement('div');
        popupDiv.className = 'password-popup';
        popupDiv.innerHTML = `
            <div class="password-card">
                <h3>🔐 লগইন করুন</h3>
                <p>জাহাঙ্গীর স'মিল অ্যাক্সেস</p>
                <input type="password" id="passInput" placeholder="পাসওয়ার্ড দিন" autofocus>
                <button id="submitPasswordBtn">প্রবেশ করুন</button>
                <p style="font-size:12px; margin-top:12px;">Support: <a href="https://wa.me/8801955255066" target="_blank"> Contact WhatsApp</a></p>
            </div>
        `;
        document.body.appendChild(popupDiv);
        
        const submitBtn = popupDiv.querySelector('#submitPasswordBtn');
        const passField = popupDiv.querySelector('#passInput');
        function checkPassword() {
            const entered = passField.value.trim();
            if (entered === '12345') {
                isAuthenticated = true;
                popupDiv.remove();
                document.getElementById('mainApp').style.display = 'block';
                updateAllCalculations();
            } else {
                alert('⚠️ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন ');
                passField.value = '';
                passField.focus();
            }
        }
        submitBtn.addEventListener('click', checkPassword);
        passField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });
    }
    
    // Initially main app hidden
    document.getElementById('mainApp').style.display = 'none';
    
    // Observer to update totals after auth
    const authObserver = new MutationObserver(function(mutations) {
        if (document.getElementById('mainApp').style.display === 'block' && !window._printedInit) {
            updateAllCalculations();
            window._printedInit = true;
            authObserver.disconnect();
        }
    });
    authObserver.observe(document.getElementById('mainApp'), { attributes: true, attributeFilter: ['style'] });
</script>
</body>
</html>
